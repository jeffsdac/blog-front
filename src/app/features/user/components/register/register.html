<h1 class="text-4xl font-light mb-10">Cadastro</h1>

<form (submit)="onSubmit($event)" class="flex flex-col gap-4">
    <app-email
        [emailField]="registerModelForm.email"
    />

    <app-username
        [loginField]="registerModelForm.username"
    />

    <app-password
        [passwordField]="registerModelForm.password"
    />

    <app-password
        [passwordField]="registerModelForm.confirmedPassword"
        label="Confirmar senha"
    />

    <div class="flex flex-col space-y-2 text-sm text-gray-300">
        <p class="text-gray-300">
            Já tem conta?
            <a routerLink="/login" class="text-pink-400 hover:underline">Entrar</a>
        </p>
    </div>

    <button type="submit"
        class="w-full bg-pink-600 hover:bg-pink-700 disabled:bg-gray-400 disabled:text-gray-200 disabled:cursor-not-allowed text-white py-3 rounded mt-6 tracking-widest transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-pink-500"
        [disabled]="registerModelForm().invalid()"
    >CADASTRAR</button>
</form>
