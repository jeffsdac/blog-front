<article class="mb-6 rounded-xl border border-white/10 bg-black/40 p-5">
    <div class="flex items-start justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="h-8 w-8 rounded-full bg-white/10 ring-1 ring-white/10"></div>
            <div>
                <div class="text-sm font-semibold text-gray-100">Masterjeff</div>
                <div class="text-xs text-gray-400">Agora</div>
            </div>
        </div>
        <button type="button" class="rounded-lg px-3 py-2 text-gray-300 hover:bg-white/5">...</button>
    </div>

    <h2 class="mt-4 text-lg font-semibold text-gray-100">{{ title }}</h2>
    <div class="mt-4 rounded-lg bg-black ring-1 ring-white/10">
        <div class="aspect-[16/7] w-full bg-black/60"></div>
    </div>

    <div class="mt-5">
        <app-post-reaction-buttons [postId]="postId" [likes]="likes" [unlikes]="unlikes" />
    </div>
</article>
