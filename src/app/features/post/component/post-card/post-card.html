<article class="mb-6 rounded-xl border border-white/10 bg-black/40 p-5">
    <div class="flex items-start justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="h-8 w-8 rounded-full bg-white/10 ring-1 ring-white/10"></div>
            <div>
                <div class="text-sm font-semibold text-gray-100">Masterjeff</div>
                <div class="text-xs text-gray-400">Agora</div>
            </div>
        </div>
        <button type="button" class="rounded-lg px-3 py-2 text-gray-300 hover:bg-white/5">...</button>
    </div>

    <h2 class="mt-4 text-lg font-semibold text-gray-100">{{ title }}</h2>

    <p class="mt-3 line-clamp-3 text-sm leading-6 text-gray-300">
        {{ content }}
    </p>

    <div class="mt-4 rounded-lg bg-black ring-1 ring-white/10">
        <div class="aspect-[16/7] w-full bg-black/60"></div>
    </div>

    <div class="mt-5 flex items-center gap-3 text-sm">
        <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full border border-emerald-400/20 bg-emerald-400/10 px-4 py-2 font-medium text-emerald-200 transition hover:border-emerald-300/40 hover:bg-emerald-400/15"
        >
            <span aria-hidden="true">👍</span>
            <span>{{ likes }}</span>
            <span class="sr-only">likes</span>
        </button>

        <button
            type="button"
            class="inline-flex items-center gap-2 rounded-full border border-rose-400/20 bg-rose-400/10 px-4 py-2 font-medium text-rose-200 transition hover:border-rose-300/40 hover:bg-rose-400/15"
        >
            <span aria-hidden="true">👎</span>
            <span>{{ unlikes }}</span>
            <span class="sr-only">unlikes</span>
        </button>
    </div>
</article>
