<main class="min-h-screen flex bg-gray-900">

    <section class="w-full md:w-1/2 flex items-center justify-center bg-black/70">
        <div class="w-full max-w-md px-8 py-12 text-white">
            <h1 class="text-4xl font-light mb-10">Login</h1>

            <form class="space-y-6" action="#" method="post">
                <div>
                    <label for="username" class="block text-sm text-gray-300 mb-2">Username</label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="JoaoSilva123"
                        class="w-full h-12 px-4 rounded bg-white/10 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-pink-500 border border-transparent"
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm text-gray-300 mb-2">Senha</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="******"
                        class="w-full h-12 px-4 rounded bg-white/10 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-pink-500 border border-transparent"
                    />
                </div>

                <div class="flex flex-col space-y-2 text-sm text-gray-300">
                    <a href="#" class="hover:underline">Esqueci minha senha</a>
                    <p class="text-gray-300">Não tem conta? <a href="#" class="text-pink-400 hover:underline">Cadastre-se</a></p>
                </div>

                <button type="submit" 
                class="w-full bg-pink-600 hover:bg-pink-700 text-white py-3 rounded mt-6 tracking-widest cursor-pointer">ENTRAR</button>
            </form>
        </div>
    </section>

    <div class="hidden md:block md:w-1/2 bg-cover bg-center" style="background-image: url('../../assets/login-bg.png')">
        <div class="w-full h-full bg-gradient-to-l from-transparent to-black/60"></div>
    </div>
    
</main>
