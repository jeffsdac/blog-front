<div>
    <label [for]="inputId" class="block text-sm text-gray-300 mb-2">{{ label }}</label>
    <input
        [formField]="passwordField"
        type="password"
        [id]="inputId"
        placeholder="******"
        class="w-full h-12 px-4 rounded bg-white/10 placeholder-gray-400 text-white focus:outline-none focus:ring-2 focus:ring-pink-500 border border-transparent"
    />


    @if (passwordField().touched() && passwordField().invalid()){
        <div class="mt-2 space-y-1" role="alert" aria-live="polite" data-testid="password-errors">
            @for (error of passwordField().errors(); track $index) {
                <div class="flex items-start text-sm text-red-400">
                    <svg class="w-4 h-4 flex-shrink-0 mt-0.5 mr-2" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M18 10c0 4.418-3.582 8-8 8s-8-3.582-8-8 3.582-8 8-8 8 3.582 8 8zm-8-3a1 1 0 00-.993.883L9 8v4a1 1 0 001.993.117L11 12V8a1 1 0 00-1-1zm0 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd" />
                    </svg>
                    <p class="leading-tight">{{ error.message }}</p>
                </div>
            }
        </div>
    }

</div>
