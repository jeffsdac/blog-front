<header class="sticky top-0 z-20 w-full border-b border-white/10 bg-gray-900/80 backdrop-blur">
    <div class="flex items-center gap-4 px-6 py-4">
        <div class="h-10 w-14 rounded bg-white/10 ring-1 ring-white/10" aria-label="Logo placeholder"></div>

        <div class="flex flex-1 justify-center">
            <div class="relative w-full max-w-xl">
                <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-300">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                            d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                        <path d="M21 21l-4.2-4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </span>
                <input
                    type="text"
                    class="h-11 w-full rounded-full bg-black/40 pl-12 pr-12 text-gray-100 ring-1 ring-white/10 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50"
                    placeholder="Buscar (placeholder)"
                    aria-label="Buscar"
                />
                <button
                    type="button"
                    class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full px-3 py-2 text-xs text-gray-300 hover:bg-white/5"
                    aria-label="Limpar busca (placeholder)"
                >
                    X
                </button>
            </div>
        </div>

        <div class="relative">
            <button
                type="button"
                class="h-10 w-10 rounded-full bg-white/10 ring-1 ring-white/10 hover:ring-pink-500/50"
                aria-label="Usuário (placeholder)"
                [attr.aria-expanded]="menuOpen()"
                (click)="toggleMenu()"
            ></button>

            @if (menuOpen()) {
                <div
                    class="absolute right-0 mt-1 w-56 overflow-hidden rounded-xl border border-white/10 bg-gray-900 shadow-lg shadow-black/40 ring-1 ring-black/20"
                    role="menu"
                    aria-label="Menu do usuário"
                >
                    <a
                        role="menuitem"
                        class="block px-4 py-3 text-sm text-gray-200 hover:bg-white/5 hover:text-white"
                        routerLink="/login"
                        (click)="closeMenu()"
                    >
                        Entrar
                    </a>
                    <a
                        role="menuitem"
                        class="block px-4 py-3 text-sm text-gray-200 hover:bg-white/5 hover:text-white"
                        routerLink="/register"
                        (click)="closeMenu()"
                    >
                        Cadastrar-se
                    </a>
                    <div class="h-px w-full bg-white/10"></div>
                    <button
                        role="menuitem"
                        type="button"
                        class="block w-full cursor-not-allowed px-4 py-3 text-left text-sm text-gray-400"
                        aria-disabled="true"
                    >
                        Primeiro post
                    </button>
                </div>
            }
        </div>
    </div>
</header>
